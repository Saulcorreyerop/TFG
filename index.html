<!doctype html>
<html lang="es">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0E0E10" />

    <!--
      Tema de PrimeReact. Va aquí y no importado desde JS por dos motivos:
      se puede cambiar en caliente sustituyendo el href (lo hace
      ThemeContext), y al estar en el HTML inicial no hay parpadeo.
      El script de debajo aplica la preferencia guardada antes de pintar.
    -->
    <link
      id="tema-primereact"
      rel="stylesheet"
      href="/themes/lara-dark-blue/theme.css"
    />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('tema') || 'oscuro'
          document.documentElement.setAttribute('data-tema', t)
          if (t === 'claro') {
            document
              .getElementById('tema-primereact')
              .setAttribute('href', '/themes/lara-light-blue/theme.css')
          }
        } catch (e) {
          document.documentElement.setAttribute('data-tema', 'oscuro')
        }
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="google-site-verification"
      content="AxfNP3EnmcgbGwVOaW6GZj0N6g74UdgM1Eg59_YsvdQ"
    />
    <!--
      Leaflet ya viene en el bundle: es la copia que usa react-leaflet.
      La del CDN era una segunda descarga de 157 KB con un <script>
      bloqueante en el head, que retrasaba el primer pintado en TODAS
      las páginas, incluidas las que no tienen mapa.
    -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="La mayor comunidad de coches en España. Encuentra eventos, rutas en tiempo real y concentraciones de coches cerca de ti."
    />

    <meta
      name="keywords"
      content="CarMeet ESP, eventos de coches, coches en tiempo real, concentraciones de coches, car meet españa, rutas"
    />
    <meta name="author" content="Saúl Correyero" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <title>CarMeet ESP | Eventos y Rutas de Coches en España</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
